<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f5f2" />
    <meta name="description" content="PRISMA — clareza para agir antes da carga chegar." />
    <title>PRISMA — Prontidão para importar</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("prisma-theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }
          if (t === "dark") {
            document.documentElement.setAttribute("data-theme", "dark");
          }
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.content = t === "dark" ? "#121211" : "#f5f5f2";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
